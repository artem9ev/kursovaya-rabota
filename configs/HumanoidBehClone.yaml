behaviors:
  Humanoid:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      # gail:
      #   strength: 0.03
      #   gamma: 0.99
      #   network_settings:
      #     normalize: true
      #     hidden_units: 256
      #     num_layers: 2
      #   encoding_size: 128
      #   demo_path: Assets/AgentsZoo/Demos/HumanoidMain1.demo
      #   learning_rate: 3.0e-4
      #   use_actions: false
      #   use_vail: false
    # behavior cloning
    behavioral_cloning:
      demo_path: Assets/AgentsZoo/Demos/HumanoidTest.demo
      strength: 0.2
      steps: 0
      batch_size: 2048
      num_epoch: 5
      samples_per_update: 0
    keep_checkpoints: 5
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 5000
