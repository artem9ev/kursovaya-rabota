behaviors:
  Humanoid_walk:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear

      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      # curiosity module
      # curiosity:
      #   strength: 0.03
      #   gamma: 0.99
      #   learning_rate: 3.0e-4
    keep_checkpoints: 20
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 15000
    threaded: true

env_settings:
  #env_path: builds/humanoid_walker_trainer
  env_args: null
  base_port: 5005
  num_envs: 1
  timeout_wait: 30
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
  
engine_settings:
  width: 50
  height: 50
  quality_level: 0
  time_scale: 10
  target_frame_rate: 30
  capture_frame_rate: 60
  no_graphics: false