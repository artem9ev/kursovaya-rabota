behaviors:
  Humanoid_walk:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      learning_rate_schedule: linear

      beta: 0.002
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 400
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      # curiosity module
      curiosity:
        strength: 0.01
        gamma: 0.95
        learning_rate: 3.0e-4
        network_settings:
          normalize: true
          hidden_units: 64
          num_layers: 2
          vis_encode_type: simple
    keep_checkpoints: 20
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 10000
    threaded: true

env_settings:
  #env_path: builds/humanoid_walker_trainer
  env_args: null
  base_port: 5005
  num_envs: 1
  timeout_wait: 30
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
  
engine_settings:
  width: 400
  height: 300
  quality_level: 0
  time_scale: 12
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

  #  mlagents-learn configs/Humanoid_walk.yaml --run-id Humanoid_walk_8 --results-dir results/walker --num-areas 4