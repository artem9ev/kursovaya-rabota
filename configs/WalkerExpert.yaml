behaviors:
  Walker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 300
      num_layers: 3
      vis_encode_type: simple
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 100000

    # behavior cloning
    behavioral_cloning:
      demo_path: G:/projects/diplom_game/Assets/ML-Agents/Examples/Walker/Demos/Expert.demo
      strength: 0.5
      steps: 150000
      batch_size: 512
      num_epoch: 3
      samples_per_update: 0

    reward_signals:
      # environment reward (default)
      extrinsic:
        strength: 1.0
        gamma: 0.995

      # curiosity module
      curiosity:
        strength: 0.02
        gamma: 0.99
        encoding_size: 256
        learning_rate: 3.0e-4

      # GAIL
      gail:
        strength: 0.01
        gamma: 0.99
        encoding_size: 128
        demo_path: G:/projects/diplom_game/Assets/ML-Agents/Examples/Walker/Demos/Expert.demo
        learning_rate: 3.0e-4
        use_actions: false
        use_vail: false
