behaviors:
  Humanoid_stand_up:
    trainer_type: sac
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear

      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 4
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 4
    network_settings:
      normalize: true
      hidden_units: 300
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    max_steps: 50000000
    time_horizon: 512
    summary_freq: 15000
    threaded: true

env_settings:
  #env_path: FoodCollector
  env_args: null
  base_port: 5005
  num_envs: 1
  timeout_wait: 30
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
  
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 5
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false

environment_parameters:
  animation_time_dec: 0.008
  