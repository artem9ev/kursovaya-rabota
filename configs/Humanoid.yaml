behaviors:
  HumanoidWalk:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.001
      learning_rate_schedule: linear

      beta: 0.008
      epsilon: 0.25
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 1.0
    keep_checkpoints: 20
    max_steps: 50000000
    time_horizon: 1024
    summary_freq: 5000
    threaded: true